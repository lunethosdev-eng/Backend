# Mantiene despierto el backend en Render (plan free)
# Ping a /api/health cada 10 minutos
name: Keep Render Awake

on:
  schedule:
    # Cada 10 min (UTC). GitHub puede retrasar unos minutos.
    - cron: "*/10 * * * *"
  workflow_dispatch: # botón "Run workflow" manual en Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Hoshi backend
        run: |
          URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://backend-1-k2na.onrender.com/api/health"
          fi
          echo "Pinging $URL"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 "$URL" || echo "000")
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 300 /tmp/health.json || true
              echo
              exit 0
            fi
            sleep 8
          done
          echo "Health check failed after retries (Render may still be cold-starting)"
          exit 0

